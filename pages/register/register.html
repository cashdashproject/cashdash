<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CashDash Casino - Реєстрація</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,700;0,900;1,900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Фон із неоновим та золотим сяйвом -->
  <div class="bg-effects">
    <div class="bg-pattern"></div>
  </div>

  <div class="registration-wrapper">
    
    <!-- Верхній логотип (Зображення) -->
    <div class="logo-container">
      <a href="../home/home.html" aria-label="Перейти на головну сторінку">
        <img src="../logo.png" alt="CashDash Casino Logo" class="logo-img">
      </a>
    </div>

    <!-- Картка реєстрації -->
    <div class="register-card">
      <div class="card-header">
        <h2>ЗАЄЄСТРУВАТИСЯ</h2>
        <p class="bonus-tag">ОТРИМАЙ <span>+300%</span> ДО ДЕПОЗИТУ</p>
      </div>

      <form class="register-form" action="#" method="post">
        
        <div class="form-group">
          <label for="username">Ім'я користувача / Нікнейм</label>
          <div class="input-box">
            <input type="text" id="username" name="username" placeholder="Введіть ваш нікнейм" required autocomplete="off">
          </div>
        </div>

        <div class="form-group">
          <label for="email">Електронна пошта</label>
          <div class="input-box">
            <input type="email" id="email" name="email" placeholder="example@cashdash.com" required autocomplete="off">
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Номер телефону</label>
          <div class="input-box">
            <input type="tel" id="phone" name="phone" placeholder="+380 (__) ___-__-__" required autocomplete="off">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <div class="input-box">
            <input type="password" id="password" name="password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="form-group checkbox-group">
          <label class="custom-checkbox">
            <input type="checkbox" required>
            <span class="checkmark"></span>
            <span class="checkbox-text">Мені виповнилося 21 рік, я приймаю <a href="#">Правила та Умови</a></span>
          </label>
        </div>

        <button type="submit" class="btn-register">
          <span>СУПЕР СТАРТ</span>
        </button>

      </form>

      <div class="card-footer">
        <p>Вже маєте акаунт? <a href="#" class="link-login">УВІЙТИ</a></p>
      </div>

    </div>

  </div>

</body>
</html>
